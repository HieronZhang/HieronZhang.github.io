acm-reusable:
  image: acm-reusable.png
  title: "ACM Artifacts Evaluated – Reusable"
acm-reproduced:
  image: acm-reproduced.png
  title: "ACM Results Reproduced"
ieee-oro:
  image: ieee-oro.png
  title: "IEEE Open Research Objects (ORO)"
ieee-ror:
  image: ieee-ror.png
  title: "IEEE Research Objects Reviewed (ROR)"
ieee-ror-r:
  image: ieee-ror-r.png
  title: "IEEE Results Reproduced (ROR-R)"
